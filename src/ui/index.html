<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColorSense</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header>
      <div class="logo">
        <span class="logo-dot dot-r"></span>
        <span class="logo-dot dot-g"></span>
        <span class="logo-dot dot-b"></span>
        <h1>ColorSense</h1>
      </div>
      <span id="status-badge" class="badge badge-off">Desativado</span>
    </header>

    <!-- Toggle principal -->
    <section class="card toggle-card">
      <div class="toggle-row">
        <div>
          <p class="label">Filtro de Acessibilidade</p>
          <p class="sublabel" id="active-type-label">Nenhum filtro ativo</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="filter-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- Seletor de tipo -->
    <section class="card">
      <p class="section-title">Tipo de Daltonismo</p>
      <div class="filter-grid" id="filter-grid"></div>
    </section>

    <!-- Intensidade -->
    <section class="card">
      <p class="section-title">Intensidade do Filtro</p>
      <div class="slider-row">
        <input type="range" id="opacity-slider" min="0" max="100" value="100">
        <span id="opacity-value">100%</span>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <span>ColorSense v0.1</span>
      <span>PUCPR · BES · 2025</span>
    </footer>

  </div>
  <script src="app.js"></script>
</body>
</html>
