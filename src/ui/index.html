<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColorSense</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header>
      <div class="logo">
        <span class="logo-dot dot-r"></span>
        <span class="logo-dot dot-g"></span>
        <span class="logo-dot dot-b"></span>
        <h1>ColorSense</h1>
      </div>
      <div class="header-right">
        <span id="user-name" class="user-name"></span>
        <button id="btn-logout" class="btn-icon" title="Sair">⏻</button>
      </div>
    </header>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="filter">Filtro</button>
      <button class="tab" data-tab="scenes">Cenas</button>
    </div>

    <div id="content" class="content"></div>

    <footer>
      <div class="footer-toggle">
        <label class="switch switch-sm">
          <input type="checkbox" id="global-toggle">
          <span class="slider"></span>
        </label>
        <span id="status-badge" class="badge badge-off">Desativado</span>
      </div>
      <span>ColorSense v0.1 · PUCPR</span>
    </footer>

  </div>
  <script src="app.js"></script>
</body>
</html>
