<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ColorSense — Entrar</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div id="app">

    <div class="logo">
      <span class="dot dot-r"></span>
      <span class="dot dot-g"></span>
      <span class="dot dot-b"></span>
      <h1>ColorSense</h1>
    </div>

    <!-- Abas -->
    <div class="tabs">
      <button class="tab active" data-tab="login">Entrar</button>
      <button class="tab" data-tab="register">Cadastrar</button>
    </div>

    <!-- Login -->
    <form id="form-login" class="form active">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="seu@email.com" required>
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <p class="error" id="login-error"></p>
      <button type="submit" class="btn-primary" id="login-btn">Entrar</button>
      <button type="button" class="btn-link" id="btn-esqueci">Esqueci minha senha</button>
    </form>

    <!-- Esqueci a senha: 1) e-mail  2) código + senha nova -->
    <form id="form-recover" class="form" novalidate>
      <p class="hint" id="rec-hint">Digite o e-mail da sua conta. Vamos mandar um código de 6 dígitos para você criar uma senha nova.</p>
      <div class="field">
        <label for="rec-email">Email</label>
        <input type="email" id="rec-email" placeholder="seu@email.com" autocomplete="email" required>
      </div>
      <div id="rec-etapa2" hidden>
        <div class="form-inner">
          <div class="field">
            <label for="rec-code">Código recebido por e-mail</label>
            <input type="text" id="rec-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456">
          </div>
          <div class="field">
            <label for="rec-pass">Nova senha</label>
            <input type="password" id="rec-pass" autocomplete="new-password" placeholder="mínimo 6 caracteres">
          </div>
          <div class="field">
            <label for="rec-pass2">Repita a nova senha</label>
            <input type="password" id="rec-pass2" autocomplete="new-password">
          </div>
        </div>
      </div>
      <p class="error" id="rec-error" role="alert"></p>
      <button type="submit" class="btn-primary" id="rec-btn">Enviar código</button>
      <div class="link-row">
        <button type="button" class="btn-link" id="rec-reenviar" hidden>Reenviar código</button>
        <button type="button" class="btn-link" id="rec-voltar">Voltar para entrar</button>
      </div>
    </form>

    <!-- Cadastro -->
    <form id="form-register" class="form">
      <div class="field">
        <label>Nome</label>
        <input type="text" id="reg-name" placeholder="Seu nome" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="seu@email.com" required>
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="reg-password" placeholder="mínimo 6 caracteres" required>
      </div>
      <div class="field">
        <label>Tipo de daltonismo</label>
        <select id="reg-daltonism">
          <option value="normal">Normal (sem daltonismo)</option>
          <option value="deuteranopia">Deuteranopia (verde)</option>
          <option value="deuteranomalia">Deuteranomalia (verde leve)</option>
          <option value="protanopia">Protanopia (vermelho)</option>
          <option value="protanomalia">Protanomalia (vermelho leve)</option>
          <option value="tritanopia">Tritanopia (azul)</option>
          <option value="tritanomalia">Tritanomalia (azul leve)</option>
          <option value="achromatopsia">Acromatopsia (sem cor)</option>
          <option value="achromatomaly">Acromatomalia (cor reduzida)</option>
        </select>
      </div>
      <p class="error" id="reg-error"></p>
      <button type="submit" class="btn-primary" id="reg-btn">Criar conta</button>
    </form>

  </div>
  <script src="auth.js"></script>
</body>
</html>
