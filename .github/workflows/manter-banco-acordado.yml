# Mantém o projeto Supabase do plano gratuito acordado.
#
# POR QUE ISSO EXISTE
#   O plano gratuito do Supabase pausa um projeto depois de 7 dias sem
#   atividade. Pausado, o endereço some do DNS e o aplicativo publicado para de
#   deixar entrar e criar conta — foi o que aconteceu em outubro de 2026, no
#   meio da coleta do estudo. A própria documentação do Supabase manda "gerar
#   atividade suficiente fazendo chamadas de API" para evitar a pausa, então
#   isto aqui é o caminho recomendado, não uma gambiarra.
#   https://supabase.com/docs/guides/platform/free-project-pausing
#
# O QUE É PRECISO CONFIGURAR (uma vez só)
#   No GitHub: Settings > Secrets and variables > Actions > New repository secret
#     SUPABASE_URL  = o Project URL (ex.: https://abcdefgh.supabase.co)
#     SUPABASE_KEY  = a chave publishable / anon (a mesma que vai no .env)
#   Não use a service_role aqui: ela ignora o RLS.
#
# O QUE ELE FAZ
#   Três vezes por semana faz uma consulta mínima na tabela users. Sem sessão o
#   RLS devolve uma lista vazia — e tudo bem: o que importa é o banco receber a
#   chamada. Se o projeto estiver fora do ar, a tarefa falha e o GitHub avisa
#   por e-mail, em vez de você descobrir por um participante.

name: Manter o banco acordado

on:
  schedule:
    - cron: '17 12 * * 1,3,5'   # segunda, quarta e sexta, 12h17 UTC (9h17 em Brasília)
  workflow_dispatch:             # dá para rodar na mão pelo botão "Run workflow"

jobs:
  acordar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Faltam os segredos SUPABASE_URL e SUPABASE_KEY no repositório."
            exit 1
          fi
          codigo=$(curl -sS -o resposta.txt -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/users?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $codigo"
          head -c 300 resposta.txt; echo
          # 200 = respondeu (lista vazia por causa do RLS, como esperado)
          if [ "$codigo" != "200" ]; then
            echo "::error::O banco não respondeu como esperado (HTTP $codigo). Veja se o projeto foi pausado em supabase.com/dashboard."
            exit 1
          fi
          echo "Banco acordado."
